# Postgres from Step 6, Redis from Part E, MinIO (S3-compatible object storage) from Part F.
# Then: DATABASE_URL=postgresql+psycopg://asr:asr@localhost:5432/asr  QUEUE_BACKEND=celery
#       STORAGE_BACKEND=s3  S3_ENDPOINT_URL=http://localhost:9000  S3_ACCESS_KEY_ID=minioadmin  S3_SECRET_ACCESS_KEY=minioadmin
services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=200
    environment: {POSTGRES_USER: asr, POSTGRES_PASSWORD: asr, POSTGRES_DB: asr}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    # appendonly: queued jobs survive a Redis restart too, not just a worker crash
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]   # 9000 = S3 API, 9001 = web console
    volumes: [miniodata:/data]
  minio-setup:        # creates the bucket once, then exits
    image: drpsychick/minio-client:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/asr-audio; exit 0"
volumes:
  pgdata:
  redisdata:
  miniodata:
