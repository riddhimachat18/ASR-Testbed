# Postgres from Step 6, Redis from Part E.
# Then: DATABASE_URL=postgresql+psycopg://asr:asr@localhost:5432/asr  QUEUE_BACKEND=celery
services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=200
    environment: {POSTGRES_USER: asr, POSTGRES_PASSWORD: asr, POSTGRES_DB: asr}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    # appendonly: queued jobs survive a Redis restart too, not just a worker crash
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
