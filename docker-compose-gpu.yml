# GPU edition of docker-compose.yml
#
# Adds an NVIDIA GPU runtime to the Celery worker service so the container
# can access the host GPU.  Everything else (Postgres, Redis, MinIO) is
# identical to docker-compose.yml.
#
# Prerequisites:
#   - NVIDIA driver installed on the host
#   - nvidia-container-toolkit installed (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html)
#   - `docker info | grep -i runtime` shows "nvidia" in the list
#
# Start infrastructure only:
#   docker compose -f docker-compose-gpu.yml up -d postgres redis minio minio-setup
#
# Then run the GPU server and worker manually (outside Docker) so you can
# iterate on code without rebuilding the image:
#   uvicorn gpu.main_gpu:factory --factory --port 8001
#   celery -A gpu.celery_app_gpu worker --concurrency=1 --loglevel=info

services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=200
    environment: {POSTGRES_USER: asr, POSTGRES_PASSWORD: asr, POSTGRES_DB: asr}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-setup:
    image: drpsychick/minio-client:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/asr-audio; exit 0"

  # ── GPU Celery worker (only needed when QUEUE_BACKEND=celery) ────────────────
  # Build your own image from the project root:
  #   docker build -t asr-testbed-gpu .
  # Then uncomment this service and adjust the image name.
  #
  # asr-worker-gpu:
  #   image: asr-testbed-gpu
  #   command: celery -A gpu.celery_app_gpu worker --concurrency=1 --loglevel=info
  #   env_file: .env.gpu
  #   depends_on: [postgres, redis]
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1           # number of GPUs to allocate (1 per worker recommended)
  #             capabilities: [gpu]

volumes:
  pgdata:
  redisdata:
  miniodata:
